                    </tr>
                </table>
            </div>
            <br>

                <table>
                    <tr>

        </div>
        
        <!--MIDDLE | JS-GENERATED BOARD-->
        <div id="board" style="background-image: 'assets/redMonsterDown.png'"></div>

        <!--PLAYER 2 MENU-->
        <div style="display:flex; flex-direction: column; align-items: center;">
            <div id="score2" class="scoreBoard"><img id="score2img" class="profile" src="assets/blueMonsterDown.png" onmouseover="boo()" onmouseout="stopBoo()"><span><b><u>Player 2</u></b></span><br><span id="result2">0</span></div>
            <div id="inventory2">

                    <td><img id="p2_1c" class="front" src="assets/blank.png"><img id="p2_1i" class="back" src="assets/blank.png"></td>

                </tr>
            </table>
            </div>
        </div>

    </div>

    <!--JS-GENERATED TOOLBOX FOR DEVMODE -->
    <div id="toolbox" class="center"></div>

    <!--COLOR PICKER FOR PAINT-->
    <div id="styles" class="center"><button onclick="paintOff()" ondblclick="paintOn()">Paint Mode: <span id="paint">Off (none)</span></button><input type="color" id="colorPicker" name="colorPicker" value="#000000"></div>

    <!--LOAD/SAVE MENU-->
    <div class="center" style="display: block"><span id="test"><button onclick="runTest()">Run Test</button><button onclick="loadGame()">Load Game</button><button onclick="saveGame()">Save Game</button><button onclick="loadFromFile()">Load from File</button><button onclick="saveToFile(sessionMapData)">Save to File</button></span></div>
    
    <!--START BUTTON-->
    <div class="center" style="display: block"><span id="start"><button onclick="start()">Start</button></span></div>

    <!--TOGGLE DEBUG MENU BUTTON-->
    <div class="center"><button onclick="toggleDebugMenu()"></button></div>
    <div id="debugMenu"></div>

    <!--DRAW MODE MENU-->
    <div class="center" style="display:flex; flex-direction: row; column-gap: 1vw;">

        <!--TOOL/MODE SELECTOR COLUMN-->
        <div>
            <!--TOOL SELECTOR-->
            <div>
                <p class="drawModeLabel">Tool:</p>
                <table>
                    <tr>
                        <td><img id="drawIcon" src="assets/drawmode/draw.png" onclick="setTool('draw')"></td>
                        <td><img id="eraseIcon" src="assets/drawmode/erase.png" onclick="setTool('erase')"></td>
                        <td><img id="inputIcon" src="assets/drawmode/input.png" onclick="setTool('input')"></td>
                        <td><img id="flipIcon" src="assets/drawmode/flipA.png" onclick="flipper()"></td>
                    </tr>
                </table>
            </div>
            
            <!--MODE SELECTOR-->
            <div>
                <p class="drawModeLabel">Mode:</p>
                <table>
                    <tr>
                        <td><img id="clickIcon" src="assets/drawmode/click.png" onclick="setMode('click')"></td>
                        <td><img id="hoverIcon" src="assets/drawmode/hover.png" onclick="setMode('hover')"></td>
                        <td><img id="bucketIcon" src="assets/drawmode/bucket.png" onclick="setMode('bucket')"></td>
                    </tr>
                </table>
            </div>
        </div>
        
        <!--SHAPE SELECTOR COLUMN-->
        <div>
            <p class="drawModeLabel">Shape:</p>
            <table>
                <tr>
                    <td><img id="dotIcon" src="assets/drawmode/dot.png" onclick="setShape('dot')"></td>
                    <td><img id="dotMidIcon" src="assets/drawmode/dotMid.png" onclick="setShape('dotMid')"></td>
                    <td><img id="dotMaxIcon" src="assets/drawmode/dotMax.png" onclick="setShape('dotMax')"></td>
                    <td><img id="hLineIcon" src="assets/drawmode/hLine.png" onclick="setShape('hLine')"></td>
                    <td><img id="vLineIcon" src="assets/drawmode/vLine.png" onclick="setShape('vLine')"></td>
                    <td><img id="tCrossIcon" src="assets/drawmode/tCross.png" onclick="setShape('tCross')"></td>
                    <td><img id="dLineAIcon" src="assets/drawmode/dLineA.png" onclick="setShape('dLineA')"></td>
                    <td><img id="dLineBIcon" src="assets/drawmode/dLineB.png" onclick="setShape('dLineB')"></td>
                </tr>
                <tr>
                    <td><img id="xCrossIcon" src="assets/drawmode/xCross.png" onclick="setShape('xCross')"></td>
                    <td><img id="boxIcon" src="assets/drawmode/box.png" onclick="setShape('box')"></td>
                    <td><img id="" src="assets/blank.png" onclick="setShape('')"></td>
                    <td><img id="" src="assets/blank.png" onclick="setShape('')"></td>
                    <td><img id="" src="assets/blank.png" onclick="setShape('')"></td>
                    <td><img id="" src="assets/blank.png" onclick="setShape('')"></td>
                    <td><img id="" src="assets/blank.png" onclick="setShape('')"></td>
                    <td><img id="" src="assets/blank.png" onclick="setShape('')"></td>
                </tr>
            </table>
        </div>

        <!--INPUT TILE SELECTOR COLUMN-->
        <div id="inputTileMenu" style="position: absolute; bottom: 2vw; right: 20vw; display: none;">
            <p class="drawModeLabel">Input Tile:</p>
            <table>
                <tr>
                    <td><img id="redMonsterIcon" src="assets/redMonsterDown.png" onclick="addPlayer1()"></td>
                    <td><img id="blueMonsterIcon" src="assets/blueMonsterDown.png" onclick="addPlayer2()"></td>
                    <td><img id="greenMonsterIcon" src="assets/greenMonsterDown.png" onclick="addBot()"></td>
                    <td><img id="chestIcon" src="assets/chest.png" onclick="setInput('chest')"></td>
                    <td><img id="goldChestIcon" src="assets/goldChest.png" onclick="setInput('goldChest')"></td>
                    <td><img id="keyIcon" src="assets/key.png" onclick="setInput('key')"></td>
                    <td><img id="heartKeyIcon" src="assets/heartKey.png" onclick="setInput('heartKey')"></td>

                    <td><img id="potionIcon" src="assets/potion.png" onclick="setInput('potion')"></td>
                    <td><img id="invisibilityIcon" src="assets/invisibility.png" onclick="setInput('invisibility')"></td>
                    <td><img id="appleIcon" src="assets/food/apple.png" onclick="setInput('apple')"></td>
                    <td><img id="bananaIcon" src="assets/food/banana.png" onclick="setInput('banana')"></td>
                    <td><img id="cherryIcon" src="assets/food/cherry.png" onclick="setInput('cherry')"></td>

                    <td><img id="kiwiIcon" src="assets/food/kiwi.png" onclick="setInput('kiwi')"></td>
                </tr>
                <tr>
                    <td><img id="lemonIcon" src="assets/food/lemon.png" onclick="setInput('lemon')"></td>
                    <td><img id="limeIcon" src="assets/food/lime.png" onclick="setInput('lime')"></td>
                    <td><img id="mangoIcon" src="assets/food/mango.png" onclick="setInput('mango')"></td>
                    <td><img id="orangeIcon" src="assets/food/orange.png" onclick="setInput('orange')"></td>
                    <td><img id="papayaIcon" src="assets/food/papaya.png" onclick="setInput('papaya')"></td>
                    <td><img id="pearIcon" src="assets/food/pear.png" onclick="setInput('pear')"></td>
                    <td><img id="pineappleIcon" src="assets/food/pineapple.png" onclick="setInput('pineapple')"></td>
                    <td><img id="rambutanIcon" src="assets/food/rambutan.png" onclick="setInput('rambutan')"></td>
                </tr>
                <tr>
                    <td><img id="soursopIcon" src="assets/food/soursop.png" onclick="setInput('soursop')"></td>
                    <td><img id="starfruitIcon" src="assets/food/starfruit.png" onclick="setInput('starfruit')"></td>
                    <td><img id="strawberryIcon" src="assets/food/strawberry.png" onclick="setInput('strawberry')"></td>
                    <td><img id="watermelonIcon" src="assets/food/watermelon.png" onclick="setInput('watermelon')"></td>
